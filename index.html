<script>
    const tg = window.Telegram && window.Telegram.WebApp;

    // Tell Telegram the Mini App is ready and expand it to full height
    if (tg && tg.initData) {
        tg.ready();
        tg.expand();
    }

    // Opens t.me links natively inside Telegram, or normally in a browser
    function openTg(url) {
        if (tg && tg.initData) {
            tg.openTelegramLink(url);
        } else {
            window.location.href = url;
        }
        return false;
    }
</script>
